name: Enforce path ownership
on:
  pull_request:
    paths: ['teams/**']

permissions:
  contents: read

jobs:
  check-ownership:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {fetch-depth: 0}
      - name: Check team ownership
        env:
          BASE: ${{ github.base_ref }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          git fetch origin "$BASE"
          BAD=0
          while IFS= read -r f; do
            TEAM=$(echo "$f" | cut -d/ -f2)
            case "$AUTHOR" in
              ramon01pro) [ "$TEAM" = "devops-dev" ] || [ "$TEAM" = "devops-prod" ] || BAD=1 ;;
              pdasilva11) [ "$TEAM" = "devops-prod" ] || BAD=1 ;;
              *) BAD=1 ;;
            esac
          done < <(git diff --name-only "origin/$BASE"...HEAD -- teams/)
          if [ "$BAD" = "1" ]; then
            echo "::error::not permitted to modify another team's env files"
            exit 1
          fi
